<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SNT – Escaneo QR</title>
  <meta name="description" content="Sistema de Validación QR – Escaneá el código QR del ciudadano.">

  <!-- CSS del proyecto SNT -->
  <!-- <link rel="stylesheet" href="https://qa-usuarios-turnos.argentina.gob.ar/styles.095039e6a6d50589.css"> -->
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css"> -->
  <link rel="stylesheet" href="assets/css/styles.095039e6a6d50589.css">
  <link rel="stylesheet" href="assets/css/select2-bootstrap-5-theme.min.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="assets/css/snt-validacion.css">
</head>

<body class="m-0 page-lectura">
  <main class="flex-column d-flex min-vh-100" id="main-content">

    <!-- Topbar -->
    <div class="topbar d-flex align-items-center p-3">
      <a id="btn-back-lectura" href="index.html" class="btn-back-icon rounded-circle text-white"
        style="width: 40px; height: 40px; background: rgba(255,255,255,0.2); text-decoration: none;"
        title="Volver al ingreso" aria-label="Volver">
        <svg class="icon-back" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1472 1600">
          <path fill="currentColor"
            d="M1472 736v128q0 53-32.5 90.5T1355 992H651l293 294q38 36 38 90t-38 90l-75 76q-37 37-90 37q-52 0-91-37L37 890Q0 853 0 800q0-52 37-91L688 59q38-38 91-38q52 0 90 38l75 74q38 38 38 91t-38 91L651 608h704q52 0 84.5 37.5T1472 736" />
        </svg>
      </a>
    </div>

    <!-- Área de cámara -->
    <div class="flex-grow-1 d-flex align-items-center justify-content-center p-4">
      <div class="ratio ratio-1x1 rounded-4 overflow-hidden shadow-sm position-relative"
        style="max-width: 280px; background: #d9d9d9;">
        <!-- Capa de interfaz de escaneo (Aislada de .ratio) -->
        <div class="position-absolute w-100 h-100 top-0 start-0">
          <div class="scan-line"></div>
          <div class="qr-corner-tl"></div>
          <div class="qr-corner-tr"></div>
          <div class="qr-corner-bl"></div>
          <div class="qr-corner-br"></div>
        </div>

        <!-- Placeholder QR -->
        <div class="d-flex align-items-center justify-content-center h-100">
          <svg class="text-dark opacity-25" width="120" height="120" viewBox="0 0 24 24" fill="currentColor"
            xmlns="http://www.w3.org/2000/svg">
            <path
              d="M4 4h6v6H4V4zm2 2v2h2V6H6zm8-2h6v6h-6V4zm2 2v2h2V6h-2zM4 14h6v6H4v-6zm2 2v2h2v-2H6zm10 0h2v2h-2v-2zm2-2h2v2h-2v-2zm0 4h2v2h-2v-2zM14 14h2v2h-2v-2zm2 2h2v2h-2v-2z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- PANEL INFERIOR -->
    <section class="panel text-center">
      <h2 class="h5 fw-bold mb-1" id="scan-status">Ya podés escanear el código QR</h2>
      <p class="panel-caption text-center mb-4">Enfocá el código QR del ciudadano para validarlo.</p>

      <!-- Botones de Simulación para Testeo -->
      <div class="d-flex gap-2 mt-auto">
        <a href="pantalla-valido.html"
          class="btn btn-success rounded-pill flex-fill py-2 fw-bold d-flex align-items-center justify-content-center gap-1 shadow-sm"
          style="font-size: 0.8rem; color: white !important;">
          <span class="icon-sm">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="50" fill="white" fill-opacity="0.3" />
              <path d="M30 50 L45 65 L75 35" stroke="white" stroke-width="12" fill="none" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </span>
          Válido
        </a>
        <a href="pantalla-error.html"
          class="btn btn-danger rounded-pill flex-fill py-2 fw-bold d-flex align-items-center justify-content-center gap-1 shadow-sm"
          style="font-size: 0.8rem; color: white !important;">
          <span class="icon-sm">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="50" fill="white" fill-opacity="0.3" />
              <g transform="translate(30, 30) scale(0.035)">
                <path fill="white"
                  d="M1202 1066q0 40-28 68l-136 136q-28 28-68 28t-68-28L608 976l-294 294q-28 28-68 28t-68-28L42 1134q-28-28-28-68t28-68l294-294L42 410q-28-28-28-68t28-68l136-136q28-28 68-28t68 28l294 294l294-294q28-28 68-28t68 28l136 136q28 28 28 68t-28 68L880 704l294 294q28 28 28 68" />
              </g>
            </svg>
          </span>
          Error
        </a>
      </div>
    </section>

    <!-- FOOTER BLANCO -->
    <footer class="panel-footer text-center">
      <div>
        <span class="fw-bold">Sistema Nacional de Turnos.</span><br>
        versión, 0000
      </div>
    </footer>

  </main>
</body>

</html>
