<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SNT – Error de Acceso</title>
  <meta name="description" content="Sistema de Validación QR – Error en la validación del código QR.">

  <!-- CSS del proyecto SNT -->
  <!-- <link rel="stylesheet" href="https://qa-usuarios-turnos.argentina.gob.ar/styles.095039e6a6d50589.css"> -->

  <link rel="stylesheet" href="assets/css/styles.095039e6a6d50589.css">
  <link rel="stylesheet" href="assets/css/select2-bootstrap-5-theme.min.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="assets/css/snt-validacion.css">
</head>

<body class="m-0 page-error">
  <main class="flex-column d-flex min-vh-100" id="main-content">

    <!-- Topbar -->
    <div class="topbar d-flex align-items-center justify-content-between p-3">
      <a id="btn-back-error" href="pantalla-lectura.html" class="btn-back-icon rounded-circle text-white"
        style="width: 40px; height: 40px; background: rgba(255,255,255,0.2); text-decoration: none;"
        title="Volver al escaneo" aria-label="Volver">
        <svg class="icon-back" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1472 1600">
          <path fill="currentColor"
            d="M1472 736v128q0 53-32.5 90.5T1355 992H651l293 294q38 36 38 90t-38 90l-75 76q-37 37-90 37q-52 0-91-37L37 890Q0 853 0 800q0-52 37-91L688 59q38-38 91-38q52 0 90 38l75 74q38 38 38 91t-38 91L651 608h704q52 0 84.5 37.5T1472 736" />
        </svg>
      </a>

      <!-- Usuario logueado y deslogueo -->
      <div class="user-badge d-flex align-items-center gap-2 text-white shadow-sm">
        <span class="user-name fw-bold" style="font-size: 0.8rem;"><i class="fa fa-user me-1"></i>Empleado SNT</span>
        <a href="index.html" class="btn-logout" title="Cerrar sesión" aria-label="Cerrar sesión">
          <i class="fa fa-sign-out"></i>
        </a>
      </div>
    </div>

    <!-- QR leído con estado de error -->
    <section class="flex-grow-1 d-flex align-items-center justify-content-center" aria-label="Código QR con error">
      <div class="qr-display">
        <!-- QR placeholder SVG -->
        <svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Módulo TL -->
          <rect x="10" y="10" width="50" height="50" rx="5" fill="#111" />
          <rect x="18" y="18" width="34" height="34" rx="3" fill="#fff" />
          <rect x="24" y="24" width="22" height="22" rx="2" fill="#111" />
          <!-- Módulo TR -->
          <rect x="100" y="10" width="50" height="50" rx="5" fill="#111" />
          <rect x="108" y="18" width="34" height="34" rx="3" fill="#fff" />
          <rect x="114" y="24" width="22" height="22" rx="2" fill="#111" />
          <!-- Módulo BL -->
          <rect x="10" y="100" width="50" height="50" rx="5" fill="#111" />
          <rect x="18" y="108" width="34" height="34" rx="3" fill="#fff" />
          <rect x="24" y="114" width="22" height="22" rx="2" fill="#111" />
          <!-- Data dots -->
          <rect x="72" y="10" width="8" height="8" fill="#111" />
          <rect x="82" y="10" width="8" height="8" fill="#111" />
          <rect x="72" y="20" width="8" height="8" fill="#111" />
          <rect x="72" y="72" width="8" height="8" fill="#111" />
          <rect x="82" y="72" width="8" height="8" fill="#111" />
          <rect x="92" y="72" width="8" height="8" fill="#111" />
          <rect x="72" y="82" width="8" height="8" fill="#111" />
          <rect x="92" y="82" width="8" height="8" fill="#111" />
          <rect x="72" y="92" width="8" height="8" fill="#111" />
          <rect x="102" y="72" width="8" height="8" fill="#111" />
          <rect x="112" y="72" width="8" height="8" fill="#111" />
          <rect x="122" y="82" width="8" height="8" fill="#111" />
          <rect x="102" y="92" width="8" height="8" fill="#111" />
          <rect x="112" y="92" width="8" height="8" fill="#111" />
          <rect x="122" y="72" width="8" height="8" fill="#111" />
          <rect x="10" y="72" width="8" height="8" fill="#111" />
          <rect x="20" y="72" width="8" height="8" fill="#111" />
          <rect x="30" y="82" width="8" height="8" fill="#111" />
          <rect x="40" y="72" width="8" height="8" fill="#111" />
          <rect x="50" y="82" width="8" height="8" fill="#111" />
          <rect x="10" y="92" width="8" height="8" fill="#111" />
          <rect x="30" y="92" width="8" height="8" fill="#111" />
          <rect x="50" y="92" width="8" height="8" fill="#111" />
        </svg>
      </div>
    </section>

    <!-- PANEL INFERIOR -->
    <section class="panel text-center" aria-label="Resultado de error en validación">

      <div class="alert alert-danger text-start">
        <div class="media d-flex align-items-center mb-2">
          <div class="media-left">
            <i class="fa fa-times-circle fa-3x"></i>
          </div>
          <div class="media-body ps-3">
            <h2 class="h4 fw-bold mb-0">Error de Acceso</h2>
          </div>
        </div>

        <div class="media-details border-top border-danger border-opacity-25 pt-3 mt-2">
          <p class="h6 fw-bold mb-1">Motivo del rechazo</p>
          <p class="margin-0">El código ya fue usado en otra oportunidad.</p>
        </div>
      </div>

      <div class="mt-4" aria-live="polite">
        <p class="text-muted mb-2" style="font-size: 0.85rem;">Volviendo al escaneo en <strong id="counter">1</strong>
          seg...</p>
        <div class="progress" style="height: 6px;">
          <div class="progress-bar-anim bg-danger" id="progress-bar"></div>
        </div>
      </div>

      <a id="btn-retry" href="pantalla-lectura.html" class="btn-retry-custom mt-4">
        <span class="icon-sm">
          <svg viewBox="0 0 1536 1536" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor"
              d="M1511 928q0 5-1 7q-64 268-268 434.5T764 1536q-146 0-282.5-55T238 1324l-129 129q-19 19-45 19t-45-19t-19-45V960q0-26 19-45t45-19h448q26 0 45 19t19 45t-19 45l-137 137q71 66 161 102t187 36q134 0 250-65t186-179q11-17 53-117q8-23 30-23h192q13 0 22.5 9.5t9.5 22.5m25-800v448q0 26-19 45t-45 19h-448q-26 0-45-19t-19-45t19-45l138-138Q969 256 768 256q-134 0-250 65T332 500q-11 17-53 117q-8 23-30 23H50q-13 0-22.5-9.5T18 608v-7q65-268 270-434.5T768 0q146 0 284 55.5T1297 212l130-129q19-19 45-19t45 19t19 45" />
          </svg>
        </span>
        Escanear otro código
      </a>

    </section>

    <!-- FOOTER BLANCO -->
    <footer class="panel-footer text-center">
      <div>
        <span class="fw-bold">Sistema Nacional de Turnos.</span><br>
        versión, 0000
      </div>
    </footer>
  </main>

  <script>
    // Cuenta regresiva y redirección automática
    let sec = 1;
    const counter = document.getElementById('counter');
    const interval = setInterval(() => {
      sec--;
      if (counter) counter.textContent = sec;
      if (sec <= 0) {
        clearInterval(interval);
        window.location.href = 'pantalla-lectura.html';
      }
    }, 1000);
  </script>
</body>

</html>
